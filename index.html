
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reach Traineeship Enrolment Tracker</title>
<style>
:root{--navy:#075477;--ink:#17324a;--muted:#64748b;--line:#dce5ee;--bg:#f3f7fb;--green:#198754;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(120deg,#064b70,#087b91);color:white;padding:24px max(20px,calc((100% - 1100px)/2))}
header h1{margin:0 0 7px;font-size:25px}
header p{margin:0;color:#e2f4fa;font-size:14px}
main{max-width:1100px;margin:22px auto;padding:0 18px 40px}
.panel,.learner,.stat{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px #15324a0a}
.panel{padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 14px}
input,select,textarea{font:inherit;border:1px solid #cbd7e2;border-radius:8px;padding:10px;width:100%;min-width:0}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}
.primary{background:var(--navy);color:white}
.secondary{background:#eaf2f8;color:#16415d}
.danger{background:#fff0ef;color:var(--red)}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px}
.stat strong{display:block;font-size:23px;color:var(--navy)}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar #search{flex:1;min-width:180px}
.learner{margin-bottom:14px;overflow:hidden}
.learner-head{padding:16px;display:flex;justify-content:space-between;gap:14px}
.learner-name{font-size:17px;font-weight:bold}
.meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
.progress-wrap{width:230px;max-width:35%;align-self:center}
.progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.bar{height:9px;background:#e9eff4;border-radius:20px;overflow:hidden}
.bar div{height:100%;background:#198f72}
.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.step-list{border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{background:#f7f9fc;border-radius:8px;padding:10px;font-size:13px}
.step.done{background:#effaf5}
.step label{display:flex;gap:8px;align-items:flex-start;font-weight:bold}
.step input[type=checkbox]{width:16px;margin:1px 0;flex:none}
.step small{display:block;color:var(--muted);margin:7px 0 0 24px;line-height:1.4}
.step input[type=date]{margin:7px 0 0 24px;width:calc(100% - 24px);padding:6px;font-size:12px}
.notes{padding:0 16px 16px}
.notes textarea{min-height:60px}
.empty{text-align:center;padding:35px;background:white;border:1px dashed #cbd7e2;border-radius:12px;color:var(--muted)}
#status{padding:10px;background:#eaf2f8;border-radius:8px;font-size:13px;margin-bottom:15px}
#app{display:none}
#login{max-width:430px;margin:35px auto}
#login button{width:100%;margin-top:12px}
.hint{font-size:12px;color:var(--muted)}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr}.step-list{grid-template-columns:1fr}.learner-head{flex-direction:column}.progress-wrap{width:100%;max-width:none}}
@media(max-width:420px){.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<h1>Reach Traineeship Enrolment Tracker</h1>
<p>Track every learner through all 11 enrolment steps.</p>
</header>

<main>
<div id="status">Please sign in to continue.</div>

<section id="login" class="panel">
<h2>Team Login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Email address" required>
br
<input id="password" type="password" placeholder="Password" required>
<button class="primary" type="submit">Sign in</button>
</form>
<p class="hint">Your team login must first be created in Supabase Authentication.</p>
</section>

<section id="app">
<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
<button class="secondary" id="logout">Sign out</button>
</div>

<section class="stats">
<div class="stat"><strong id="total">0</strong><span>Total learners</span></div>
<div class="stat"><strong id="completed">0</strong><span>Fully completed</span></div>
<div class="stat"><strong id="active">0</strong><span>In progress</span></div>
<div class="stat"><strong id="average">0%</strong><span>Average progress</span></div>
</section>

<section class="panel">
<h2>Add a learner</h2>
<form id="addForm">
<div class="formgrid">
<input id="name" placeholder="Learner name *" required>
<input id="learnerId" placeholder="Learner ID / CID">
<input id="coordinator" placeholder="Training Coordinator">
<input id="trainer" placeholder="Trainer">
<input id="start" type="date" title="Start date">
<input id="end" type="date" title="End date">
</div>
<textarea id="newNotes" placeholder="Notes (optional)" rows="2"></textarea>
<div style="text-align:right;margin-top:12px">
<button class="primary" type="submit">＋ Add learner</button>
</div>
</form>
</section>

<div class="toolbar">
<input id="search" placeholder="Search learner, ID, coordinator or trainer...">
<select id="filter" style="width:auto">
<option value="all">All learners</option>
<option value="progress">In progress</option>
<option value="complete">Completed</option>
<option value="notstarted">Not started</option>
</select>
<button class="secondary" id="export">Export CSV</button>
<button class="secondary" id="refresh">Refresh</button>
</div>

<div id="learners"></div>
</section>
</main>

<script src="config.js"></script>
<script type="module">
import {createClient} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const cfg=window.TRACKER_CONFIG||{};
const status=document.getElementById("status");

if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){
 status.textContent="Connection settings missing. Check config.js.";
 throw Error("Supabase configuration missing");
}

const db=createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const TABLE="traineeship_learners";

const stepNames=[
"Initial Contact",
"Sign-Up Sheet – To be sent to ACC",
"Send Enrolment Link",
"Send LLND Link",
"Await TCID Approval and upon TCID Approval",
"Receive Registration / Accept Enrolment",
"Mark LLND",
"Upload Results",
"Get in touch with Trainer for the date of visit",
"Fill out Form on RFS",
"Complete Commitment ID Form on RFS"
];

let learners=[];
let user=null;
let channel=null;

const $=id=>document.getElementById(id);
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function defaultSteps(){
 return stepNames.map((title,index)=>({
  number:index+1,title,done:false,date:"",note:""
 }));
}

function normaliseSteps(value){
 let saved=Array.isArray(value)?value:[];
 return stepNames.map((title,index)=>{
  const old=saved.find(s=>Number(s.number)===index+1);
  return {
   number:index+1,title,
   done:!!old?.done,
   date:old?.date||"",
   note:old?.note||""
  };
 });
}

function count(l){
 return (l.steps||[]).filter(s=>s.done).length;
}

function setStatus(message){
 status.textContent=message;
}

function showApp(show){
 $("login").style.display=show?"none":"block";
 $("app").style.display=show?"block":"none";
}

async function loadLearners(){
 const {data,error}=await db.from(TABLE)
  .select("*").order("created_at",{ascending:false});
 if(error)throw error;
 learners=(data||[]).map(r=>({
  ...r,steps:normaliseSteps(r.steps)
 }));
 render();
}

function render(){
 const total=learners.length;
 const complete=learners.filter(l=>count(l)===11).length;
 const active=learners.filter(l=>count(l)>0&&count(l)<11).length;

 $("total").textContent=total;
 $("completed").textContent=complete;
 $("active").textContent=active;
 $("average").textContent=total?
  Math.round(learners.reduce((a,l)=>a+count(l)/11,0)/total*100)+"%":"0%";

 const q=$("search").value.toLowerCase();
 const f=$("filter").value;

 const shown=learners.filter(l=>{
  const p=count(l);
  const text=[l.learner_name,l.learner_id,l.coordinator,l.trainer].join(" ").toLowerCase();
  return text.includes(q)&&(
   f==="all"||
   (f==="complete"&&p===11)||
   (f==="progress"&&p>0&&p<11)||
   (f==="notstarted"&&p===0)
  );
 });

 if(!shown.length){
  $("learners").innerHTML=`<div class="empty">${
   learners.length?"No matching learners found.":"No learners added yet."
  }</div>`;
  return;
 }

 $("learners").innerHTML=shown.map(l=>{
  const p=count(l),pct=Math.round(p/11*100);
  return `<article class="learner" data-id="${safe(l.id)}">
   <div class="learner-head">
    <div style="flex:1;min-width:0">
     <div class="learner-name">${safe(l.learner_name)}</div>
     <div class="meta">
      Learner ID: ${safe(l.learner_id||"-")}<br>
      Start: ${safe(l.start_date||"-")} · End: ${safe(l.end_date||"-")}<br>
      Coordinator: ${safe(l.coordinator||"-")} · Trainer: ${safe(l.trainer||"-")}
     </div>
     <div class="actions">
      <button class="secondary edit" data-id="${safe(l.id)}">Edit details</button>
      <button class="danger delete" data-id="${safe(l.id)}">Delete</button>
     </div>
    </div>
    <div class="progress-wrap">
     <div class="progress-label">
      <span>${p===11?"Completed":p===0?"Not started":"In progress"}</span>
      <strong>${p}/11 · ${pct}%</strong>
     </div>
     <div class="bar"><div style="width:${pct}%"></div></div>
    </div>
   </div>
   <div class="step-list">
    ${l.steps.map(s=>`
     <div class="step ${s.done?"done":""}">
      <label>
       <input type="checkbox" class="stepcheck"
        data-id="${safe(l.id)}" data-step="${s.number}"
        ${s.done?"checked":""}>
       <span>${s.number}. ${safe(s.title)}</span>
      </label>
      <input type="date" class="stepdate"
       data-id="${safe(l.id)}" data-step="${s.number}"
       value="${safe(s.date)}" title="Completion date">
      <small>${s.done?"Completed":"Pending"}</small>
     </div>
    `).join("")}
   </div>
   <div class="notes">
    <textarea class="note" data-id="${safe(l.id)}"
     placeholder="Learner notes / follow-up...">${safe(l.notes||"")}</textarea>
   </div>
  </article>`;
 }).join("");
}

async function saveLearner(l){
 const {error}=await db.from(TABLE).update({
  learner_name:l.learner_name,
  learner_id:l.learner_id||"",
  start_date:l.start_date||null,
  end_date:l.end_date||null,
  coordinator:l.coordinator||"",
  trainer:l.trainer||"",
  notes:l.notes||"",
  steps:l.steps,
  updated_at:new Date().toISOString()
 }).eq("id",l.id);
 if(error)throw error;
}

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 setStatus("Signing in...");
 const {data,error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 if(error){
  setStatus("Login failed: "+error.message);
  return;
 }
 user=data.user;
 await enterApp();
});

async function enterApp(){
 showApp(true);
 setStatus("Loading shared learners...");
 try{
  await loadLearners();
  setStatus("Connected. Shared tracker is ready.");
  if(channel)await db.removeChannel(channel);
  channel=db.channel("traineeship-learners-live")
   .on("postgres_changes",{
    event:"*",schema:"public",table:TABLE
   },async()=>{
    try{
     await loadLearners();
     setStatus("Shared tracker updated.");
    }catch(e){setStatus("Refresh error: "+e.message);}
   }).subscribe();
 }catch(e){
  setStatus("Could not load learners: "+e.message);
 }
}

$("logout").addEventListener("click",async()=>{
 if(channel){await db.removeChannel(channel);channel=null;}
 await db.auth.signOut();
 user=null;
 showApp(false);
 setStatus("You have signed out.");
});

$("addForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const record={
  learner_name:$("name").value.trim(),
  learner_id:$("learnerId").value.trim(),
  start_date:$("start").value||null,
  end_date:$("end").value||null,
  coordinator:$("coordinator").value.trim(),
  trainer:$("trainer").value.trim(),
  notes:$("newNotes").value.trim(),
  steps:defaultSteps(),
  created_by:user.id
 };
 if(!record.learner_name)return;
 setStatus("Adding learner...");
 const {data,error}=await db.from(TABLE).insert(record).select().single();
 if(error){
  setStatus("Could not add learner: "+error.message);
  alert(error.message);
  return;
 }
 learners.unshift({...data,steps:normaliseSteps(data.steps)});
 e.target.reset();
 render();
 setStatus("Learner added successfully.");
});

$("learners").addEventListener("change",async e=>{
 const id=e.target.dataset.id;
 const l=learners.find(x=>x.id===id);
 if(!l)return;

 const n=Number(e.target.dataset.step);
 const step=l.steps.find(s=>s.number===n);
 if(!step)return;

 const previous={...step};

 if(e.target.classList.contains("stepcheck")){
  step.done=e.target.checked;
  if(step.done&&!step.date)step.date=new Date().toISOString().slice(0,10);
  if(!step.done)step.date="";
 }else if(e.target.classList.contains("stepdate")){
  step.date=e.target.value;
  step.done=!!step.date;
 }else return;

 render();
 try{
  await saveLearner(l);
  setStatus("Step updated and saved.");
 }catch(err){
  Object.assign(step,previous);
  render();
  alert("Could not save step: "+err.message);
 }
});

$("learners").addEventListener("input",e=>{
 if(!e.target.classList.contains("note"))return;
 const l=learners.find(x=>x.id===e.target.dataset.id);
 if(!l)return;
 l.notes=e.target.value;
 clearTimeout(l.noteTimer);
 l.noteTimer=setTimeout(async()=>{
  try{
   await saveLearner(l);
   setStatus("Notes saved.");
  }catch(err){setStatus("Notes save failed: "+err.message);}
 },800);
});

$("learners").addEventListener("click",async e=>{
 const id=e.target.dataset.id;
 const l=learners.find(x=>x.id===id);
 if(!l)return;

 if(e.target.classList.contains("delete")){
  if(!confirm("Delete "+l.learner_name+" and all tracking details?"))return;
  const {error}=await db.from(TABLE).delete().eq("id",id);
  if(error){alert("Delete failed: "+error.message);return;}
  learners=learners.filter(x=>x.id!==id);
  render();
  setStatus("Learner deleted.");
 }

 if(e.target.classList.contains("edit")){
  const fields=[
   ["learner_name","Learner name"],
   ["learner_id","Learner ID"],
   ["start_date","Start date"],
   ["end_date","End date"],
   ["coordinator","Training Coordinator"],
   ["trainer","Trainer"]
  ];
  const changes={};
  for(const [key,label] of fields){
   const value=prompt(label+":",l[key]||"");
   if(value===null)return;
   changes[key]=value.trim();
  }
  if(!changes.learner_name){alert("Learner name is required.");return;}
  Object.assign(l,changes);
  l.start_date=l.start_date||null;
  l.end_date=l.end_date||null;
  try{
   await saveLearner(l);
   render();
   setStatus("Learner details updated.");
  }catch(err){alert("Update failed: "+err.message);}
 }
});

$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);

$("refresh").addEventListener("click",async()=>{
 try{
  await loadLearners();
  setStatus("Tracker refreshed.");
 }catch(e){setStatus("Refresh failed: "+e.message);}
});

$("export").addEventListener("click",()=>{
 const headers=[
  "Learner","Learner ID","Start Date","End Date",
  "Coordinator","Trainer","Completed Steps","Progress %",
  ...stepNames,"Notes"
 ];
 const rows=learners.map(l=>[
  l.learner_name,l.learner_id,l.start_date,l.end_date,
  l.coordinator,l.trainer,count(l),Math.round(count(l)/11*100)+"%",
  ...l.steps.map(s=>s.done?"Completed":"Pending"),l.notes
 ]);
 const csv=[headers,...rows].map(row=>
  row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")
 ).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="Reach-Traineeship-Tracker.csv";a.click();
 URL.revokeObjectURL(url);
});

async function init(){
 const {data,error}=await db.auth.getSession();
 if(error){setStatus(error.message);return;}
 if(data.session){
  user=data.session.user;
  await enterApp();
 }else{
  showApp(false);
  setStatus("Please sign in using your team account.");
 }
}

init();
</script>
</body>
</html>
